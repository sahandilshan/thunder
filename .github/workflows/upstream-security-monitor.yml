name: Upstream security monitor

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_call:
    inputs:
      monitor_ref:
        description: Commit containing the monitor implementation
        required: true
        type: string
      dry_run:
        description: Preview notifications without sending messages
        type: boolean
        default: false
    secrets:
      GOOGLE_CHAT_SECURITY_WEBHOOK:
        required: false
      UPSTREAM_READ_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview notifications without posting to Chat or changing state
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: upstream-security-monitor
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository != 'thunder-id/thunderid' && vars.SECURITY_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.monitor_ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: "11.21.0"
          run_install: false
      - name: Test monitor
        run: node --test .github/security-monitor/monitor.test.mjs
      - name: Audit upstream main and inspect failed upstream jobs
        run: node .github/security-monitor/monitor.mjs scan report.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UPSTREAM_READ_TOKEN: ${{ secrets.UPSTREAM_READ_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-monitor-report
          path: report.json
          retention-days: 3
          if-no-files-found: error

  notify:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.monitor_ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-monitor-report
      - name: Notify Google Chat and save delivery state
        run: node .github/security-monitor/monitor.mjs notify report.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_CHAT_SECURITY_WEBHOOK: ${{ secrets.GOOGLE_CHAT_SECURITY_WEBHOOK }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
